<!DOCTYPE html>
<html>
<head>
    <title>VolleyAPI Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">

    <h2>VolleyAPI</h2>

    <a href="#">🏠 Dashboard</a>
    <a href="players.html">👤 Players</a>
    <a href="#">🏐 Teams</a>
    <a href="#">🏆 Tournaments</a>
    <a href="#">⚙️ Settings</a>

    <button onclick="logout()">
        Logout
    </button>

</div>

<div class="main">

    <div class="topbar">
        <h1>Dashboard</h1>
    </div>

    <div class="cards">

        <div class="stat-card">
            <h2 id="playersCount">0</h2>
            <p>Players</p>
        </div>

        <div class="stat-card">
            <h2 id="teamsCount">0</h2>
            <p>Teams</p>
        </div>

        <div class="stat-card">
            <h2 id="tournamentsCount">0</h2>
            <p>Tournaments</p>
        </div>

    </div>

</div>

<script>

const token = localStorage.getItem("token");

if(!token){
    window.location.href = "login.html";
}

function logout(){

    localStorage.removeItem("token");

    window.location.href = "login.html";
}

</script>

</body>
</html>
