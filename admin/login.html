<!DOCTYPE html>
<html>
<head>
    <title>VolleyAPI Admin Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>VolleyAPI Admin</h1>

    <input
        type="text"
        id="username"
        placeholder="Username"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button onclick="login()">
        Login
    </button>

    <p id="message"></p>

</div>

<script src="login.js"></script>

</body>
</html>
